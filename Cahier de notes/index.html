<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notes vocales — NEXUS</title>
<style>
:root{
  --bg:#05070f;
  --panel:rgba(14,20,40,.72);
  --line:rgba(0,229,255,.18);
  --text:#e6f7ff;
  --muted:#6f85a8;
  --cyan:#00e5ff;
  --magenta:#ff2bd6;
  --lime:#b6ff3b;
  --violet:#a855ff;
  --danger:#ff3b6b;
  --boulot:#00e5ff;
  --business:#b6ff3b;
  --appli:#ff2bd6;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;padding:28px 16px 48px;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--text);
  background:
    radial-gradient(900px 500px at 10% -10%,rgba(0,229,255,.16),transparent 60%),
    radial-gradient(800px 500px at 110% 10%,rgba(255,43,214,.14),transparent 60%),
    radial-gradient(700px 600px at 50% 120%,rgba(168,85,255,.14),transparent 60%),
    var(--bg);
  background-attachment:fixed;
}
/* grille HUD en arrière-plan */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(0,229,255,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,229,255,.05) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse at center,#000 40%,transparent 80%);
}
main{position:relative;z-index:1;max-width:1000px;margin:0 auto}

/* En-tête */
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:14px}
.logo{
  width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
  border:1px solid var(--cyan);box-shadow:0 0 18px rgba(0,229,255,.35),inset 0 0 14px rgba(0,229,255,.2);
  background:rgba(0,229,255,.06);
}
.logo svg{width:24px;height:24px;stroke:var(--cyan);fill:none;stroke-width:2;stroke-linecap:round}
h1{margin:0;font-size:1.5rem;letter-spacing:.2em;text-transform:uppercase;font-weight:700;
  text-shadow:0 0 14px rgba(0,229,255,.55)}
.sub{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.72rem;color:var(--muted);letter-spacing:.15em;margin-top:4px}
.stats{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.75rem;color:var(--muted);
  border:1px solid var(--line);padding:8px 12px;border-radius:999px;background:rgba(0,0,0,.25)}
.stats b{color:var(--lime);font-weight:700}
#syncBtn{border-color:var(--danger);color:var(--danger)}
#syncBtn.synced{border-color:var(--lime);color:var(--lime)}

/* Panneaux verre */
.panel{
  position:relative;background:var(--panel);
  border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:22px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 0 0 1px rgba(0,0,0,.4),0 20px 60px -20px rgba(0,229,255,.25);
}
.panel::before,.panel::after{content:"";position:absolute;width:18px;height:18px;border-color:var(--cyan);border-style:solid;opacity:.8}
.panel::before{top:-1px;left:-1px;border-width:2px 0 0 2px;border-radius:18px 0 0 0}
.panel::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0;border-radius:0 0 18px 0}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Visualiseur d'onde */
.wave{display:flex;align-items:center;justify-content:center;gap:4px;height:70px;margin-bottom:18px}
.wave span{
  width:4px;height:8px;border-radius:4px;
  background:linear-gradient(180deg,var(--cyan),var(--magenta));
  box-shadow:0 0 8px rgba(0,229,255,.5);
  transition:height .3s ease;
}
.wave.active span{animation:wave 1.1s ease-in-out infinite}
.wave span:nth-child(2n){animation-duration:.8s}
.wave span:nth-child(3n){animation-duration:1.4s}
.wave span:nth-child(5n){animation-duration:.95s}
.wave span:nth-child(1){animation-delay:-.1s}
.wave span:nth-child(4){animation-delay:-.4s}
.wave span:nth-child(7){animation-delay:-.7s}
.wave span:nth-child(10){animation-delay:-.2s}
.wave span:nth-child(13){animation-delay:-.6s}
.wave span:nth-child(16){animation-delay:-.3s}
.wave span:nth-child(19){animation-delay:-.9s}
.wave span:nth-child(22){animation-delay:-.5s}
@keyframes wave{0%,100%{height:8px}50%{height:64px}}

/* Boutons */
button{
  font:inherit;font-size:.92rem;cursor:pointer;position:relative;
  padding:11px 18px;border-radius:12px;
  border:1px solid var(--line);background:rgba(0,229,255,.05);color:var(--text);
  transition:box-shadow .2s,background .2s,transform .1s;
}
button:hover:not(:disabled){box-shadow:0 0 16px rgba(0,229,255,.35);background:rgba(0,229,255,.12)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.35;cursor:not-allowed}
#recBtn{
  border-color:var(--cyan);color:#021018;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  background:linear-gradient(135deg,var(--cyan),#5b8cff);
  box-shadow:0 0 20px rgba(0,229,255,.45);
}
#recBtn.recording{
  border-color:var(--magenta);color:#fff;
  background:linear-gradient(135deg,var(--magenta),#ff5e7e);
  box-shadow:0 0 22px rgba(255,43,214,.6);
  animation:pulse 1.4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{box-shadow:0 0 14px rgba(255,43,214,.45)}50%{box-shadow:0 0 34px rgba(255,43,214,.9)}}
.primary{border-color:var(--lime);color:#081200;font-weight:700;background:linear-gradient(135deg,var(--lime),#38ffb0)}
.primary:hover:not(:disabled){box-shadow:0 0 18px rgba(182,255,59,.5);background:linear-gradient(135deg,var(--lime),#38ffb0)}
.danger{color:var(--danger);border-color:rgba(255,59,107,.4)}
.danger:hover:not(:disabled){box-shadow:0 0 16px rgba(255,59,107,.35);background:rgba(255,59,107,.1)}

#status{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.8rem;color:var(--cyan);
  letter-spacing:.04em;margin-left:auto;text-shadow:0 0 8px rgba(0,229,255,.5);
}
#status::before{content:"> ";color:var(--muted)}

/* Zone de transcription */
textarea,select{font:inherit;color:var(--text)}
textarea{
  width:100%;min-height:120px;resize:vertical;margin:14px 0;padding:14px 16px;border-radius:12px;
  background:rgba(0,0,0,.35);border:1px solid var(--line);outline:none;line-height:1.5;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.95rem;
  transition:border-color .2s,box-shadow .2s;
}
textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,229,255,.15)}
textarea::placeholder{color:var(--muted)}
select{
  padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.35);
  outline:none;cursor:pointer;
}
select:focus{border-color:var(--cyan)}
label{display:flex;gap:10px;align-items:center;font-size:.9rem;color:var(--muted);letter-spacing:.04em}

/* Cartes des catégories */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px}
.card{
  position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;
  display:flex;flex-direction:column;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  --c:var(--cyan);
}
.card.boulot{--c:var(--boulot)}
.card.business{--c:var(--business)}
.card.appli{--c:var(--appli)}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--c);box-shadow:0 0 14px var(--c)}
.card header{
  padding:16px 18px;display:flex;justify-content:space-between;align-items:center;
  font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.85rem;color:var(--c);
  border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.03),transparent);
}
.count{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.8rem;
  min-width:34px;text-align:center;padding:3px 8px;border-radius:8px;
  color:#05070f;background:var(--c);box-shadow:0 0 10px var(--c);
}
.card ul{list-style:none;margin:0;padding:6px 18px 14px;max-height:440px;overflow:auto;flex:1}
.card li{
  padding:12px 0 12px 14px;border-bottom:1px dashed var(--line);font-size:.95rem;line-height:1.45;
  white-space:pre-wrap;word-break:break-word;position:relative;
}
.card li::before{content:"";position:absolute;left:0;top:18px;width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.card li:last-child{border-bottom:none}
.card li small{
  display:block;color:var(--muted);margin-top:6px;font-size:.72rem;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.05em;
}
.empty{color:var(--muted);font-style:italic;list-style:none;font-size:.9rem}
.empty::before{display:none}
.card li{padding-right:34px}
.note-del{
  position:absolute;right:0;top:9px;width:26px;height:26px;padding:0;
  display:grid;place-items:center;border-radius:8px;font-size:.9rem;line-height:1;
  border:1px solid rgba(255,59,107,.35);background:rgba(255,59,107,.06);color:var(--danger);
  opacity:.7;
}
.note-del:hover:not(:disabled){opacity:1;box-shadow:0 0 12px rgba(255,59,107,.5);background:rgba(255,59,107,.15)}
.card ul::-webkit-scrollbar{width:6px}
.card ul::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

@media (max-width:560px){
  h1{font-size:1.2rem}
  #status{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){
  .wave.active span,#recBtn.recording{animation:none}
}
</style>
</head>
<body>
<main>
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </div>
      <div>
        <h1>Notes vocales</h1>
        <div class="sub">SYSTÈME DE CAPTURE // V.2</div>
      </div>
    </div>
    <div class="row">
      <div class="stats">NOTES : <b id="total">0</b></div>
      <button id="syncBtn" type="button">Synchroniser GitHub</button>
    </div>
  </header>

  <section class="panel">
    <div class="wave" id="wave" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="row">
      <button id="recBtn">● Enregistrer</button>
      <span id="status">Prêt</span>
    </div>

    <textarea id="transcript" placeholder="La transcription apparaîtra ici (vous pouvez la modifier)…"></textarea>

    <div class="row">
      <label>Catégorie :
        <select id="category">
          <option value="auto">Automatique</option>
          <option value="boulot">Boulot</option>
          <option value="business">Business</option>
          <option value="appli">Appli</option>
        </select>
      </label>
      <button id="addBtn" class="primary" disabled>Ajouter la note</button>
      <button id="clearBtn">Vider</button>
      <button id="deleteLastBtn" class="danger" disabled>Supprimer le dernier enregistrement</button>
    </div>
  </section>

  <section class="grid">
    <article class="card boulot">
      <header><span>Boulot</span><span class="count" id="count-boulot">0</span></header>
      <ul id="list-boulot"></ul>
    </article>
    <article class="card business">
      <header><span>Business</span><span class="count" id="count-business">0</span></header>
      <ul id="list-business"></ul>
    </article>
    <article class="card appli">
      <header><span>Appli</span><span class="count" id="count-appli">0</span></header>
      <ul id="list-appli"></ul>
    </article>
  </section>
</main>

<script>
const CATS = ['boulot', 'business', 'appli'];
const LABELS = { boulot: 'Boulot', business: 'Business', appli: 'Appli' };
const KEYWORDS = {
  boulot: ['réunion', 'collègue', 'équipe', 'chef', 'bureau', 'mail', 'rapport', 'planning', 'deadline', 'rendez-vous', 'tâche', 'projet'],
  business: ['client', 'vente', 'chiffre', 'budget', 'facture', 'marché', 'investisseur', 'stratégie', 'marge', 'bénéfice', 'prospect', 'contrat', 'offre'],
  appli: ['appli', 'application', 'bug', 'fonctionnalité', 'écran', 'bouton', 'code', 'version', 'interface', 'notification', 'développer', 'mise à jour', 'test']
};
const STORE_KEY = 'notes-vocales-v1';
const NOTES_API = '../api/notes';

const recBtn = document.getElementById('recBtn');
const statusEl = document.getElementById('status');
const transcript = document.getElementById('transcript');
const categorySel = document.getElementById('category');
const addBtn = document.getElementById('addBtn');
const clearBtn = document.getElementById('clearBtn');
const deleteLastBtn = document.getElementById('deleteLastBtn');
const waveEl = document.getElementById('wave');

let notes = load();
let notesFileSha = null;
let notesSynced = false;
let notesSyncQueue = Promise.resolve();
let notesSyncPending = 0;
let listening = false;
let finalText = '';
let recognition = null;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

// Stockage : texte seulement. L'audio n'est jamais conservé.
function load() {
  try {
    return JSON.parse(localStorage.getItem(STORE_KEY)) || [];
  } catch { return []; }
}
function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(notes));
  } catch {}
  if (notesSynced) queueNotesSave();
}

function setNotesSyncState(synced) {
  const button = document.getElementById('syncBtn');
  button.classList.toggle('synced', synced && notesSyncPending === 0);
  button.title = synced && notesSyncPending === 0 ? 'Notes synchronisées avec GitHub' : 'Notes non synchronisées avec GitHub';
  button.setAttribute('aria-label', button.title);
}

async function writeNotes() {
  const response = await fetch(NOTES_API, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ notes, ...(notesFileSha ? { sha: notesFileSha } : {}) })
  });
  const result = await response.json().catch(() => ({}));
  if (!response.ok) {
    if (response.status === 409) notesFileSha = null;
    throw new Error(result.error || `Échec de l'enregistrement (${response.status}).`);
  }
  notesFileSha = result.sha;
}

function queueNotesSave() {
  notesSyncPending++;
  setNotesSyncState(false);
  notesSyncQueue = notesSyncQueue.then(async () => {
    try {
      await writeNotes();
    } catch (error) {
      statusEl.textContent = 'Synchronisation impossible : ' + error.message;
      notesSynced = false;
    } finally {
      notesSyncPending--;
      setNotesSyncState(notesSynced);
    }
  });
}

async function syncNotes() {
  const button = document.getElementById('syncBtn');
  button.disabled = true;
  statusEl.textContent = 'Synchronisation avec GitHub…';
  try {
    await notesSyncQueue;
    const response = await fetch(NOTES_API);
    if (response.status === 404) {
      notesFileSha = null;
      await writeNotes();
    } else {
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.error || `Lecture impossible (${response.status}).`);
      notesFileSha = result.sha;
      const merged = new Map((result.notes || []).map(note => [String(note.id), note]));
      for (const note of notes) if (!merged.has(String(note.id))) merged.set(String(note.id), note);
      notes = [...merged.values()];
      try { localStorage.setItem(STORE_KEY, JSON.stringify(notes)); } catch {}
      if (notes.length !== result.notes.length) await writeNotes();
    }
    notesSynced = true;
    setNotesSyncState(true);
    render();
    statusEl.textContent = 'Notes synchronisées avec GitHub.';
  } catch (error) {
    notesSynced = false;
    setNotesSyncState(false);
    statusEl.textContent = 'Synchronisation impossible : ' + error.message;
  } finally { button.disabled = false; }
}

// Supprime les anciens audios stockés par les versions précédentes
try { indexedDB.deleteDatabase('notes-vocales-audio'); } catch {}

function classify(text) {
  const t = text.toLowerCase();
  let best = 'boulot', score = 0;
  for (const c of CATS) {
    const s = KEYWORDS[c].reduce((n, k) => n + (t.includes(k) ? 1 : 0), 0);
    if (s > score) { score = s; best = c; }
  }
  return best;
}

function updateButtons() {
  addBtn.disabled = listening || !transcript.value.trim();
  clearBtn.disabled = listening;
  deleteLastBtn.disabled = !notes.length;
}

if (SR) {
  recognition = new SR();
  recognition.lang = 'fr-FR';
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) finalText += r[0].transcript + ' ';
      else interim += r[0].transcript;
    }
    transcript.value = (finalText + interim).trimStart();
    updateButtons();
  };
  recognition.onend = () => { if (listening) recognition.start(); };
  recognition.onerror = e => {
    if (e.error !== 'no-speech') statusEl.textContent = 'Erreur de reconnaissance : ' + e.error;
  };
}

function startRecording() {
  if (!recognition) {
    statusEl.textContent = 'Transcription vocale non supportée par ce navigateur (saisissez le texte).';
    return;
  }
  finalText = transcript.value.trim() ? transcript.value.trim() + ' ' : '';
  listening = true;
  recBtn.textContent = '■ Arrêter';
  recBtn.classList.add('recording');
  waveEl.classList.add('active');
  statusEl.textContent = 'Enregistrement en cours…';
  try { recognition.start(); } catch {}
  updateButtons();
}

function stopRecording() {
  listening = false;
  if (recognition) { try { recognition.stop(); } catch {} }
  recBtn.textContent = '● Enregistrer';
  recBtn.classList.remove('recording');
  waveEl.classList.remove('active');
  statusEl.textContent = 'Enregistrement terminé';
  updateButtons();
}

recBtn.addEventListener('click', () => listening ? stopRecording() : startRecording());
document.getElementById('syncBtn').addEventListener('click', syncNotes);
transcript.addEventListener('input', updateButtons);

addBtn.addEventListener('click', () => {
  const text = transcript.value.trim();
  if (!text) return;
  const chosen = categorySel.value;
  const cat = chosen === 'auto' ? classify(text) : chosen;
  notes.push({ id: Date.now(), text, cat, date: new Date().toLocaleString('fr-FR') });
  save();
  transcript.value = '';
  finalText = '';
  render();
  statusEl.textContent = 'Note ajoutée dans ' + LABELS[cat];
});

clearBtn.addEventListener('click', () => {
  transcript.value = '';
  finalText = '';
  updateButtons();
});

deleteLastBtn.addEventListener('click', () => {
  if (!notes.length) return;
  if (!confirm('Supprimer le dernier enregistrement ?')) return;
  notes.pop();
  save();
  render();
  statusEl.textContent = 'Dernier enregistrement supprimé';
});

function deleteNote(id) {
  const note = notes.find(n => n.id === id);
  if (!note) return;
  if (!confirm('Supprimer cette note ?')) return;
  notes = notes.filter(n => n.id !== id);
  save();
  render();
  statusEl.textContent = 'Note supprimée de ' + LABELS[note.cat];
}

function render() {
  document.getElementById('total').textContent = notes.length;
  for (const c of CATS) {
    const ul = document.getElementById('list-' + c);
    const items = notes.filter(n => n.cat === c);
    document.getElementById('count-' + c).textContent = items.length;
    ul.innerHTML = '';
    if (!items.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = 'Aucune note';
      ul.appendChild(li);
      continue;
    }
    items.forEach(n => {
      const li = document.createElement('li');
      li.textContent = n.text;
      const sm = document.createElement('small');
      sm.textContent = n.date;
      li.appendChild(sm);
      const del = document.createElement('button');
      del.className = 'note-del';
      del.title = 'Supprimer cette note';
      del.setAttribute('aria-label', 'Supprimer cette note');
      del.textContent = '✕';
      del.disabled = listening;
      del.addEventListener('click', () => deleteNote(n.id));
      li.appendChild(del);
      ul.appendChild(li);
    });
    ul.scrollTop = ul.scrollHeight;
  }
  updateButtons();
}

if (!SR) statusEl.textContent = 'Transcription vocale non supportée par ce navigateur (essayez Chrome, Edge ou Safari).';
render();
</script>
</body>
</html>
