    <ellipse cx="302" cy="376" rx="37" ry="26" fill="#a64d37"/><ellipse cx="378" cy="364" rx="37" ry="25" fill="#c19143"/><ellipse cx="454" cy="379" rx="37" ry="25" fill="#74824a"/>
