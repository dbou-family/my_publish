<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Courses au marché</title>
  <desc id="desc">Scène éditoriale d'une cliente choisissant des fruits et légumes sur un étal de marché.</desc>
  <defs>
    <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#e8e2d5"/><stop offset="1" stop-color="#c9c2b1"/></linearGradient>
    <linearGradient id="light" x2="1" y2="1"><stop stop-color="#fff8df" stop-opacity=".8"/><stop offset="1" stop-color="#fff8df" stop-opacity="0"/></linearGradient>
    <linearGradient id="coat" x2="1" y2="1"><stop stop-color="#334b45"/><stop offset="1" stop-color="#192f2c"/></linearGradient>
    <linearGradient id="produce" x2="0" y2="1"><stop stop-color="#8e9a60"/><stop offset="1" stop-color="#596844"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="13"/></filter>
  </defs>
  <rect width="800" height="450" fill="url(#wall)"/>
  <path d="M0 0h800v58H0z" fill="#43534a" opacity=".92"/>
  <path d="M0 58h800v18H0z" fill="#efe7d6" opacity=".82"/>
  <!-- Lumière et arrière-plan de marché -->
