  <path d="M28 80h188v223H28zM245 80h196v223H245zM472 80h294v223H472z" fill="#7d8877" opacity=".2"/>
  <path d="M0 77h800v242H0z" fill="url(#light)"/>
  <g opacity=".45" filter="url(#soft)" fill="#f6eedb">
    <ellipse cx="130" cy="147" rx="82" ry="71"/><ellipse cx="374" cy="136" rx="95" ry="62"/><ellipse cx="660" cy="145" rx="115" ry="73"/>
  </g>
  <!-- Étagères et caisses -->
  <path d="M0 228h800v11H0zM0 300h800v13H0z" fill="#806c53" opacity=".72"/>
  <path d="M26 174h182v48H26zM254 167h177v55H254zM493 175h275v47H493z" fill="#927b5e" opacity=".65"/>
  <g opacity=".86">
    <circle cx="66" cy="194" r="18" fill="#a34d36"/><circle cx="103" cy="193" r="17" fill="#c28b39"/><circle cx="140" cy="195" r="18" fill="#6f804b"/><circle cx="177" cy="194" r="16" fill="#a34d36"/>
    <circle cx="293" cy="191" r="17" fill="#7b8547"/><circle cx="331" cy="190" r="19" fill="#c18d3d"/><circle cx="372" cy="190" r="17" fill="#a64c37"/><circle cx="409" cy="190" r="16" fill="#75834b"/>
    <circle cx="544" cy="196" r="18" fill="#bd8038"/><circle cx="584" cy="194" r="18" fill="#9d4835"/><circle cx="624" cy="196" r="18" fill="#758649"/><circle cx="665" cy="193" r="19" fill="#c19747"/><circle cx="709" cy="195" r="17" fill="#a24d35"/><circle cx="747" cy="194" r="17" fill="#788349"/>
  </g>
